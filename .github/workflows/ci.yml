name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Exposed job-wide so the postgres/redis storage contract suites in
      # backend/storage/storage-contract.test.ts actually run (they skip
      # locally when these are unset). STORE_BACKEND stays unset: only the
      # contract tests touch the services, the rest keep the memory store.
      DATABASE_URL: postgres://poker:poker@localhost:5432/poker_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-app/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check backend (noEmit)
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test

      - name: Install frontend dependencies
        run: npm --prefix frontend-app ci

      - name: Run frontend unit tests
        run: npm --prefix frontend-app run test

      - name: Build frontend SPA
        run: npm --prefix frontend-app run build

      - name: Build backend (tsc emit)
        run: npm run build

  deploy:
    name: Deploy to server
    # Only after CI passes, and only on a real push to main (never on PRs or
    # forks). Secrets are unavailable to pull_request events by design.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub "production" environment: attach required reviewers / secrets
    # scoping here if you later want a manual approval gate before deploy.
    environment: production
    steps:
      - name: SSH deploy (pull latest + rebuild compose stack)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Fail the job on any command error so a broken deploy is visible.
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/texas-poker' }}
            git fetch --all
            git reset --hard origin/main
            # Rebuild only what changed; keeps postgres/redis volumes intact.
            docker compose up -d --build
            docker compose ps
            # Smoke check via the app container's internal port (independent
            # of whichever host NGINX_PORT this box uses).
            docker compose exec -T app node -e "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
