# deploy/nginx.conf - Sticky reverse proxy for the multi-instance app tier.
#
# `app` is the compose service name; with replicas >= 2 Docker's embedded
# DNS resolves it to every replica IP and nginx load-balances across them.
# ip_hash pins a client IP to one replica so the socket.io polling
# handshake and the websocket upgrade land on the same instance.
# Caveat: nginx resolves `app` once at startup — after scaling replicas,
# run `docker compose restart nginx` to pick up the new set.

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # GZIP for text payloads (SPA assets, JSON APIs).
  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript
             image/svg+xml;

  # Canonical websocket upgrade mapping (empty Upgrade header → close).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream poker_app {
    ip_hash;
    server app:3000;
  }

  server {
    listen 80;

    # Socket.IO: long-polling + websocket upgrade.
    location /socket.io/ {
      proxy_pass http://poker_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Must exceed the server pingInterval (25s) + pingTimeout (60s).
      proxy_read_timeout 90s;
    }

    # REST API.
    location /api/ {
      proxy_pass http://poker_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else: SPA static assets + history-mode fallback + /health.
    location / {
      proxy_pass http://poker_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
